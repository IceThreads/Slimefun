<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>粘液科技知识库</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ========== CSS 变量（浅色默认） ========== */
        :root {
            --primary: #2D3B66;
            --primary-light: #EFF2F9;
            --primary-dark: #1A2639;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-secondary: #64748B;
            --border: #E2E8F0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --nav-width: 260px;
            --lightbox-bg: rgba(0, 0, 0, 0.75);
            --placeholder-icon: #CBD5E1;
            --highlight-bg: #FDE68A;
            --highlight-text: #1E293B;
            --tree-leaf-active: var(--primary);
            --tree-leaf-active-text: #fff;
        }

        /* ========== 深色模式变量覆盖 ========== */
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #8B9DC3;
                --primary-light: #2A3346;
                --primary-dark: #6A7DA6;
                --bg: #12161E;
                --card-bg: #1E2636;
                --text: #E8EDF5;
                --text-secondary: #9AA8C7;
                --border: #2E3A4F;
                --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
                --shadow-hover: 0 8px 28px rgba(0, 0, 0, 0.6);
                --lightbox-bg: rgba(0, 0, 0, 0.85);
                --placeholder-icon: #3A4A62;
                --highlight-bg: #FCD34D;
                --highlight-text: #1E293B;
                --tree-leaf-active: #6A7DA6;
                --tree-leaf-active-text: #FFFFFF;
            }
        }

        /* ========== 全局重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.2s, color 0.2s;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            background: var(--card-bg);
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            flex-wrap: wrap;
            box-shadow: var(--shadow);
            z-index: 10;
            transition: background 0.2s, border-color 0.2s;
        }
        .top-bar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
        }
        .top-bar .brand i {
            font-size: 22px;
        }
        .top-bar .search-wrap {
            flex: 1;
            min-width: 160px;
            position: relative;
        }
        .top-bar .search-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }
        .top-bar .search-wrap input {
            width: 100%;
            padding: 8px 16px 8px 40px;
            border: 2px solid var(--border);
            border-radius: 30px;
            font-size: 14px;
            background: var(--bg);
            transition: 0.25s ease;
            outline: none;
            color: var(--text);
        }
        .top-bar .search-wrap input:focus {
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.12);
        }
        .top-bar .search-wrap input::placeholder {
            color: var(--text-secondary);
        }
        .top-bar .result-count {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .top-bar .result-count strong {
            color: var(--text);
        }

        /* ===== 主体 ===== */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== 左侧导航 ===== */
        .nav-side {
            width: var(--nav-width);
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px 0 24px;
            flex-shrink: 0;
            transition: background 0.2s, border-color 0.2s;
        }
        .nav-side::-webkit-scrollbar {
            width: 4px;
        }
        .nav-side::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .nav-tree {
            list-style: none;
            padding: 0 8px;
        }
        .nav-tree li {
            list-style: none;
        }

        .tree-node {
            cursor: pointer;
            user-select: none;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s, color 0.15s;
            font-size: 14px;
            color: var(--text-secondary);
            position: relative;
        }
        .tree-node:hover {
            background: var(--primary-light);
            color: var(--text);
        }
        .tree-node .toggle-icon {
            font-size: 12px;
            width: 20px;
            text-align: center;
            transition: transform 0.2s;
            flex-shrink: 0;
            color: var(--text-secondary);
        }
        .tree-node .toggle-icon.expanded {
            transform: rotate(90deg);
        }
        .tree-node .node-label {
            flex: 1;
            word-break: break-word;
        }
        .tree-node .node-label .highlight {
            background: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 0 4px;
            border-radius: 4px;
        }

        .tree-children {
            padding-left: 24px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
        }
        .tree-children.open {
            max-height: 2000px;
        }

        .tree-leaf {
            padding: 6px 12px 6px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: background 0.15s, color 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 2px 0;
            position: relative;
        }
        .tree-leaf:hover {
            background: var(--primary-light);
            color: var(--text);
        }
        .tree-leaf.active {
            background: var(--tree-leaf-active);
            color: var(--tree-leaf-active-text);
            font-weight: 500;
        }
        .tree-leaf.active .node-label .highlight {
            background: var(--highlight-bg);
            color: var(--highlight-text);
        }
        .tree-leaf .node-label {
            flex: 1;
        }
        .tree-leaf .node-label .highlight {
            background: var(--highlight-bg);
            color: var(--highlight-text);
            padding: 0 4px;
            border-radius: 4px;
        }

        .nav-empty {
            padding: 30px 16px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .nav-empty i {
            font-size: 28px;
            color: var(--placeholder-icon);
            display: block;
            margin-bottom: 8px;
        }

        /* ===== 右侧内容区 ===== */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 32px 40px 60px;
            background: var(--bg);
            transition: background 0.2s;
        }
        .content-area::-webkit-scrollbar {
            width: 6px;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .content-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 20px;
        }
        .content-placeholder .big-icon {
            font-size: 64px;
            color: var(--placeholder-icon);
            margin-bottom: 16px;
        }
        .content-placeholder h3 {
            font-size: 24px;
            color: var(--text);
            margin-bottom: 8px;
        }
        .content-placeholder p {
            font-size: 16px;
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .content-placeholder .search-hint {
            background: var(--card-bg);
            padding: 4px 16px 4px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
            max-width: 480px;
        }
        .content-placeholder .search-hint:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.12);
        }
        .content-placeholder .search-hint i {
            color: var(--primary);
            font-size: 16px;
        }
        .content-placeholder .search-hint input {
            border: none;
            background: transparent;
            padding: 10px 4px;
            font-size: 15px;
            outline: none;
            color: var(--text);
            width: 100%;
            min-width: 120px;
        }
        .content-placeholder .search-hint input::placeholder {
            color: var(--text-secondary);
        }

        /* 内容卡片 */
        .content-card {
            max-width: 820px;
            margin: 0 auto;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .content-card .section-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            padding-bottom: 12px;
            border-bottom: 3px solid var(--primary-light);
        }
        .content-card .section-desc {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.7;
        }
        .content-card .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 8px;
        }
        .content-card .image-grid .img-wrapper {
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            background: var(--card-bg);
            border: 1px solid var(--border);
            aspect-ratio: 4 / 3;
            position: relative;
        }
        .content-card .image-grid .img-wrapper:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }
        .content-card .image-grid .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .content-card .image-grid .img-wrapper .img-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.3));
            color: #fff;
            padding: 8px 12px 6px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .content-card .image-grid .img-wrapper:hover .img-label {
            opacity: 1;
        }

        .no-images {
            color: var(--text-secondary);
            background: var(--primary-light);
            padding: 30px 20px;
            text-align: center;
            border-radius: var(--radius-sm);
            border: 2px dashed var(--border);
            font-size: 14px;
        }
        .no-images i {
            font-size: 30px;
            display: block;
            margin-bottom: 6px;
            color: var(--placeholder-icon);
        }

        /* ===== 图片灯箱 ===== */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--lightbox-bg);
            backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 30px;
            animation: lightboxIn 0.25s ease;
        }
        .lightbox.active {
            display: flex;
        }
        @keyframes lightboxIn {
            from {
                opacity: 0;
                transform: scale(0.94);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .lightbox .close-lightbox {
            position: absolute;
            top: 24px;
            right: 32px;
            font-size: 32px;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
            opacity: 0.8;
            transition: transform 0.2s;
        }
        .lightbox .close-lightbox:hover {
            transform: rotate(90deg);
            opacity: 1;
        }
        .lightbox .lightbox-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: var(--radius-sm);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            object-fit: contain;
            background: #1E293B;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .top-bar {
                padding: 10px 16px;
                gap: 10px;
            }
            .top-bar .brand {
                font-size: 16px;
            }
            .top-bar .result-count {
                font-size: 13px;
            }
            .nav-side {
                width: 200px;
                padding: 12px 4px;
            }
            .content-area {
                padding: 20px 16px 40px;
            }
            .content-card .section-title {
                font-size: 22px;
            }
            .content-card .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 14px;
            }
            .content-placeholder .search-hint {
                max-width: 100%;
            }
        }
        @media (max-width: 560px) {
            .main {
                flex-direction: column;
            }
            .nav-side {
                width: 100%;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .content-area {
                flex: 1;
            }
            .content-card .image-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .lightbox .lightbox-img {
                max-width: 98%;
                max-height: 70vh;
            }
            .lightbox .close-lightbox {
                top: 12px;
                right: 16px;
                font-size: 28px;
            }
            .content-placeholder h3 {
                font-size: 20px;
            }
            .content-placeholder .big-icon {
                font-size: 48px;
            }
            .content-placeholder .search-hint input {
                min-width: 80px;
                font-size: 14px;
            }
        }
        .nav-side .tree-node,
        .nav-side .tree-leaf {
            font-size: 13px;
            padding: 5px 10px;
        }
        .tree-children {
            padding-left: 16px;
        }
    </style>
</head>
<body>

    <!-- ===== 顶部搜索栏 ===== -->
    <header class="top-bar">
        <div class="brand">
            <i class="fas fa-book-open"></i>
            <span>知识大纲</span>
        </div>
        <div class="search-wrap">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="输入关键词搜索…" autocomplete="off" />
        </div>
        <div class="result-count" id="resultCount">
            已收录 <strong id="totalCount">0</strong> 个
        </div>
    </header>

    <!-- ===== 主体 ===== -->
    <div class="main">
        <nav class="nav-side" id="navSide">
            <ul class="nav-tree" id="navTree"></ul>
            <div class="nav-empty" id="navEmpty" style="display:none;">
                <i class="fas fa-search"></i>
                没有匹配的内容
            </div>
        </nav>

        <section class="content-area" id="contentArea">
            <!-- 搜索引导占位（默认显示） -->
            <div class="content-placeholder" id="placeholder">
                <div class="big-icon"><i class="fas fa-search"></i></div>
                <h3>开始探索</h3>
                <p>输入关键词搜索</p>
                <div class="search-hint">
                    <i class="fas fa-search"></i>
                    <input type="text" id="placeholderSearchInput" placeholder="输入关键词搜索…" autocomplete="off" />
                </div>
            </div>
            <!-- 内容卡片（初始隐藏） -->
            <div id="contentCard" style="display:none;"></div>
        </section>
    </div>

    <!-- ===== 图片灯箱 ===== -->
    <div class="lightbox" id="lightbox">
        <button class="close-lightbox" id="closeLightbox"><i class="fas fa-times"></i></button>
        <img class="lightbox-img" id="lightboxImg" src="" alt="点击放大" />
    </div>

    <script>
        // ================================================================
        //  数据
        // ================================================================
        const data = [{
            id: 'mod1',
            title: '基础机器',
            children: [{
                id: 'sec1-1',
                title: '增强型工作台',
                description: '【多方快结构】增强型工作台由1个工作台与一个发射器组成',
                images: [
                    '/Slimefun/增强型工作台.png',
                ]
            }, {
                id: 'sec1-2',
                title: '物品输出箱',
                description: '漏斗x1，箱子x1，铅锭x1',
                images: [
                    '/Slimefun/物品输出箱.png',
                ]
            }, {
                id: 'sec1-3',
                title: '磨石',
                description: '发射器（朝上）x1，栅栏x1',
                images: [
                    '/Slimefun/磨石.png',
                ]
            }, {
                id: 'sec1-4',
                title: '盔甲锻造台',
                description: '发射器（朝上）x1，铁砧x1',
                images: [
                    '/Slimefun/盔甲锻造台.png',
                ]
                }, {
                id: 'sec1-5',
                title: '矿石粉碎机',
                description: '发射器（朝上）x1，下界砖栅栏x1，铁栏杆x2',
                images: [
                    '/Slimefun/矿石粉碎机.png',
                ]
            }]
        }, {

            id: 'mod2',
            title: '⚛️ 框架与库',
            children: [{
                id: 'sec2-1',
                title: 'HTML 入门',
                description: 'HTML 是构建网页的基石。掌握常用标签、语义化结构和表单元素。',
                images: [
                    'https://picsum.photos/seed/html1/600/400',
                    'https://picsum.photos/seed/html2/600/400',
                    'https://picsum.photos/seed/html3/600/400',
                ]
            }, {
                id: 'sec2-2',
                title: 'CSS 核心概念',
                description: '层叠样式表 (CSS) 用于控制网页外观。包括选择器、盒模型、布局和响应式设计。',
                images: [
                    'https://picsum.photos/seed/css1/600/400',
                    'https://picsum.photos/seed/css2/600/400',
                ]
            }, {
                id: 'sec2-3',
                title: 'JavaScript 基础',
                description: 'JavaScript 为网页添加交互性。涵盖变量、函数、事件和 DOM 操作。',
                images: [
                    'https://picsum.photos/seed/js1/600/400',
                    'https://picsum.photos/seed/js2/600/400',
                    'https://picsum.photos/seed/js3/600/400',
                    'https://picsum.photos/seed/js4/600/400',
                ]
            }]
        }, {

            id: 'mod3',
            title: '⚛️ 框架与库',
            children: [{
                id: 'sec3-1',
                title: 'React 入门',
                description: 'React 用于构建用户界面的 JavaScript 库。学习组件、状态、生命周期和 Hooks。',
                images: [
                    'https://picsum.photos/seed/react1/600/400',
                    'https://picsum.photos/seed/react2/600/400',
                ]
            }, {
                id: 'sec3-2',
                title: 'Vue.js 基础',
                description: 'Vue 是一套用于构建用户界面的渐进式框架。掌握模板语法、响应式数据和组件通信。',
                images: [
                    'https://picsum.photos/seed/vue1/600/400',
                    'https://picsum.photos/seed/vue2/600/400',
                    'https://picsum.photos/seed/vue3/600/400',
                ]
            }]
        }, {
            id: 'mod4',
            title: '🎨 设计工具',
            children: [{
                id: 'sec4-1',
                title: 'Figma 协作',
                description: 'Figma 是流行的 UI/UX 设计工具，支持多人实时协作、组件化和原型设计。',
                images: [
                    'https://picsum.photos/seed/figma1/600/400',
                    'https://picsum.photos/seed/figma2/600/400',
                ]
            }, {
                id: 'sec4-2',
                title: 'Adobe XD 快速原型',
                description: 'Adobe XD 提供一站式 UX/UI 设计解决方案，从线框到交互原型。',
                images: [
                    'https://picsum.photos/seed/xd1/600/400',
                ]
            }]
        }];

        // ================================================================
        //  状态
        // ================================================================
        let activeSectionId = null;
        let searchKeyword = '';

        function buildSectionMap() {
            const map = {};
            data.forEach(mod => {
                mod.children.forEach(sec => {
                    map[sec.id] = {
                        ...sec,
                        parentTitle: mod.title,
                        parentId: mod.id,
                    };
                });
            });
            return map;
        }
        const sectionMap = buildSectionMap();
        const allSections = Object.values(sectionMap);

        // ================================================================
        //  DOM 引用
        // ================================================================
        const navTree = document.getElementById('navTree');
        const navEmpty = document.getElementById('navEmpty');
        const searchInput = document.getElementById('searchInput');
        const placeholderSearchInput = document.getElementById('placeholderSearchInput');
        const totalCount = document.getElementById('totalCount');
        const contentCard = document.getElementById('contentCard');
        const placeholder = document.getElementById('placeholder');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeLightbox = document.getElementById('closeLightbox');

        // ================================================================
        //  工具
        // ================================================================
        function highlightText(text, keyword) {
            if (!keyword.trim()) return text;
            const kw = keyword.trim();
            const idx = text.toLowerCase().indexOf(kw.toLowerCase());
            if (idx === -1) return text;
            const before = text.slice(0, idx);
            const match = text.slice(idx, idx + kw.length);
            const after = text.slice(idx + kw.length);
            return `${before}<span class="highlight">${match}</span>${after}`;
        }

        // ================================================================
        //  核心搜索同步函数
        // ================================================================
        function updateSearch(value) {
            // 同步两个输入框的值
            if (searchInput.value !== value) searchInput.value = value;
            if (placeholderSearchInput.value !== value) placeholderSearchInput.value = value;
            searchKeyword = value;
            renderNav();
        }

        // ================================================================
        //  渲染导航
        // ================================================================
        function renderNav() {
            const kw = searchKeyword.trim().toLowerCase();
            let visibleSectionIds = [];

            let html = '';
            data.forEach(mod => {
                const modTitleMatch = kw ? mod.title.toLowerCase().includes(kw) : false;

                let childrenHtml = '';
                let hasVisibleChild = false;

                mod.children.forEach(sec => {
                    const secTitleMatch = kw ? sec.title.toLowerCase().includes(kw) : false;
                    const shouldShow = (kw === '' || modTitleMatch || secTitleMatch);
                    if (shouldShow) {
                        hasVisibleChild = true;
                        visibleSectionIds.push(sec.id);
                        const isActive = (sec.id === activeSectionId);
                        const label = kw ? highlightText(sec.title, kw) : sec.title;
                        childrenHtml += `
                            <li class="tree-leaf ${isActive ? 'active' : ''}" data-section-id="${sec.id}">
                                <span class="node-label">${label}</span>
                                ${isActive ? '<i class="fas fa-chevron-right" style="font-size:10px;color:rgba(255,255,255,0.6);"></i>' : ''}
                            </li>
                        `;
                    }
                });

                if (modTitleMatch || hasVisibleChild) {
                    const modLabel = kw ? highlightText(mod.title, kw) : mod.title;
                    html += `
                        <li>
                            <div class="tree-node" data-mod-id="${mod.id}">
                                <span class="toggle-icon expanded"><i class="fas fa-chevron-right"></i></span>
                                <span class="node-label">${modLabel}</span>
                            </div>
                            <ul class="tree-children open">
                                ${childrenHtml}
                            </ul>
                        </li>
                    `;
                }
            });

            if (!html) {
                navTree.innerHTML = '';
                navEmpty.style.display = 'block';
                totalCount.textContent = '0';
                if (activeSectionId) {
                    activeSectionId = null;
                    renderContent();
                }
                return;
            }

            navTree.innerHTML = html;
            navEmpty.style.display = 'none';
            totalCount.textContent = visibleSectionIds.length;

            // 绑定叶子点击
            document.querySelectorAll('.tree-leaf').forEach(el => {
                el.addEventListener('click', function() {
                    const id = this.dataset.sectionId;
                    if (id) setActiveSection(id);
                });
            });

            // 绑定模块折叠
            document.querySelectorAll('.tree-node[data-mod-id]').forEach(el => {
                el.addEventListener('click', function(e) {
                    const children = this.nextElementSibling;
                    if (children && children.classList.contains('tree-children')) {
                        children.classList.toggle('open');
                        const icon = this.querySelector('.toggle-icon');
                        if (icon) icon.classList.toggle('expanded');
                    }
                });
            });

            // 自动选中第一个可见小节（仅当 activeSectionId 存在且不可见时）
            const visibleLeaves = document.querySelectorAll('.tree-leaf');
            if (visibleLeaves.length > 0) {
                const firstId = visibleLeaves[0].dataset.sectionId;
                const activeStillVisible = activeSectionId && document.querySelector(`.tree-leaf[data-section-id="${activeSectionId}"]`);
                if (activeSectionId && !activeStillVisible) {
                    setActiveSection(firstId, true);
                } else if (!activeSectionId) {
                    // 初始不选中，保持 null
                }
            } else {
                if (activeSectionId) {
                    activeSectionId = null;
                    renderContent();
                }
            }
        }

        // ================================================================
        //  激活小节 & 内容渲染
        // ================================================================
        function setActiveSection(sectionId, silent = false) {
            if (activeSectionId === sectionId && !silent) return;
            activeSectionId = sectionId;
            document.querySelectorAll('.tree-leaf').forEach(el => {
                el.classList.toggle('active', el.dataset.sectionId === sectionId);
            });
            renderContent();
            const activeEl = document.querySelector(`.tree-leaf[data-section-id="${sectionId}"]`);
            if (activeEl) {
                activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function renderContent() {
            if (!activeSectionId) {
                contentCard.style.display = 'none';
                placeholder.style.display = 'flex';
                return;
            }
            const sec = sectionMap[activeSectionId];
            if (!sec) {
                contentCard.style.display = 'none';
                placeholder.style.display = 'flex';
                return;
            }

            placeholder.style.display = 'none';
            contentCard.style.display = 'block';

            const imagesHtml = sec.images && sec.images.length > 0 ?
                `<div class="image-grid">` +
                sec.images.map((url, idx) => `
                    <div class="img-wrapper" data-imgurl="${url}">
                        <img src="${url}" alt="${sec.title} 图片 ${idx+1}" loading="lazy" />
                        <div class="img-label">点击放大</div>
                    </div>
                `).join('') +
                `</div>` :
                `<div class="no-images"><i class="fas fa-image"></i> 此小节暂无图片</div>`;

            contentCard.innerHTML = `
                <div class="content-card">
                    <h2 class="section-title">${sec.title}</h2>
                    <p class="section-desc">${sec.description || '（暂无描述）'}</p>
                    ${imagesHtml}
                </div>
            `;

            contentCard.querySelectorAll('.img-wrapper').forEach(wrapper => {
                wrapper.addEventListener('click', function() {
                    const url = this.dataset.imgurl;
                    if (url) openLightbox(url);
                });
            });
        }

        // ================================================================
        //  图片灯箱
        // ================================================================
        function openLightbox(url) {
            lightboxImg.src = url;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightboxFn() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeLightbox.addEventListener('click', closeLightboxFn);
        lightbox.addEventListener('click', function(e) {
            if (e.target === this) closeLightboxFn();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightboxFn();
            }
        });

        // ================================================================
        //  搜索事件绑定
        // ================================================================
        searchInput.addEventListener('input', function(e) {
            updateSearch(this.value);
        });

        placeholderSearchInput.addEventListener('input', function(e) {
            updateSearch(this.value);
        });

        // ================================================================
        //  初始化：显示搜索引导，不选中任何小节
        // ================================================================
        function init() {
            activeSectionId = null;
            renderNav(); // 由于 activeSectionId 为 null，不会自动选中
            renderContent(); // 显示 placeholder
            totalCount.textContent = allSections.length;
        }

        init();
    </script>
</body>
</html>
